name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # packages/adapters resolves @flip-7/engine through its package.json
      # exports field, which points at dist/ — so lint, typecheck and test
      # all need it built first on a clean checkout. The full `pnpm build`
      # below (including apps/web's Next.js build) stays last so the cheap
      # checks still fail fast ahead of it.
      - name: Build workspace packages
        run: pnpm --filter @flip-7/engine build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Post coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: pnpm build
